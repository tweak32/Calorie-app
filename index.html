<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Calorie"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Calorie</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#182638;background:#f6f8fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}main{max-width:520px;margin:auto;padding:26px 18px 110px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8b98a8;font-weight:700}h1{font-size:31px;letter-spacing:-1px;margin:3px 0}h2{font-size:16px;margin:25px 0 12px}.card{background:white;border-radius:18px;padding:20px;margin:12px 0}.datebar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}.datebar button,.plain{border:0;background:transparent;color:#347ef0;padding:10px;font-size:21px}.datebar strong{font-size:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.small{font-size:13px;color:#8290a2}.big{font-size:33px;font-weight:700;letter-spacing:-1px;margin:7px 0}.red{color:#d53c43!important}.track{height:7px;background:#e9edf4;border-radius:9px;overflow:hidden;margin:18px 0 13px}.fill{height:100%;background:#347ef0;border-radius:9px}.fill.over{background:#d53c43}.center{text-align:center}.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #eff1f5}.line:last-child{border:0}.line button{border:0;background:transparent;text-align:left;width:100%;padding:0;color:inherit}.line .value{white-space:nowrap;color:#718096;font-size:14px}.primary{border:0;background:#347ef0;color:white;font-weight:650;border-radius:13px;padding:15px 18px;width:100%;margin-top:14px}.secondary{border:1px solid #d9e0ea;background:white;color:#347ef0;border-radius:11px;padding:10px 14px}.danger{color:#cf3640;background:none;border:0;padding:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8edf4;display:flex;justify-content:space-around;padding:12px 5px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#9ba6b5;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}.nav button.active{color:#347ef0;font-weight:700}.nav span{font-size:22px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week button{border:0;background:#f4f6f9;border-radius:10px;padding:12px 1px;color:#42536a}.week button.active{background:#347ef0;color:white}.week small{display:block;margin-bottom:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sheetbg{position:fixed;inset:0;background:#17203355;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:22px 22px 0 0;padding:22px;width:100%;max-width:520px;padding-bottom:calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 20px}.field{display:block;font-size:13px;color:#69798b;margin:15px 0 6px}input[type=text],input[type=number]{width:100%;border:1px solid #dce3ed;border-radius:11px;padding:13px;background:white;color:#182638;font-size:17px}.unit{display:flex;gap:8px}.unit button{flex:1;border:1px solid #dce3ed;background:white;border-radius:10px;padding:11px}.unit button.active{background:#e8f0ff;border-color:#347ef0;color:#347ef0}.hint{font-size:13px;color:#347ef0;margin-top:7px}.muted{color:#8592a3;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between}.empty{padding:25px 0;text-align:center;color:#9ba6b5}.hidden{display:none}.modalbuttons{display:flex;gap:8px}.modalbuttons>*{flex:1}input[type=checkbox]{accent-color:#347ef0;width:18px;height:18px}button:disabled{opacity:.45}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><div id="overlay"></div><script>
const KEY='calorie-v1';const initial={goal:1600,entries:{},favourites:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(initial)};let tab='today',offset=0,weekOffset=0,selected=null,editing=null,unit='kcal';const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const at=n=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d};const dayKey=()=>key(at(offset));const entries=k=>data.entries[k]||[];const sum=k=>entries(k).reduce((a,b)=>a+b.cal,0);const fmt=n=>Math.round(n).toLocaleString('en-AU');const long=d=>d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});const uid=()=>String(Date.now())+Math.random().toString(36).slice(2);function render(){let content='';if(tab==='today'){let k=dayKey(),total=sum(k),left=data.goal-total,percent=Math.min(100,total/data.goal*100);content=`<div class="datebar"><button onclick="offset--;render()">‹</button><strong>${offset===0?'Today · ':''}${long(at(offset))}</strong><button onclick="offset++;render()">›</button></div><section class="card"><div class="stats"><div><div class="small">Eaten</div><div class="big">${fmt(total)}</div><div class="small">kcal</div></div><div><div class="small">Remaining</div><div class="big ${left<0?'red':''}">${fmt(left)}</div><div class="small">kcal</div></div></div><div class="track"><div class="fill ${left<0?'over':''}" style="width:${percent}%"></div></div><div class="small center">Daily goal: ${fmt(data.goal)} kcal</div></section><h2>Food logged</h2><section class="card">${entries(k).length?entries(k).map(f=>`<div class="line"><button onclick="openFood('${f.id}')">${esc(f.name)}</button><span class="value">${fmt(f.cal)} kcal</span><button style="width:auto;color:#9ca8b7" onclick="openFood('${f.id}')">›</button></div>`).join(''):'<div class="empty">No food logged yet</div>'}</section><button class="primary" onclick="openFood()">+ Add Food</button>`}else if(tab==='history'){let monday=at(-((at(0).getDay()+6)%7)+weekOffset*7);let days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return d});if(!selected||!days.some(d=>key(d)===selected))selected=key(days[0]);let total=days.reduce((a,d)=>a+sum(key(d)),0);let loggedDays=days.filter(d=>entries(key(d)).length>0).length;content=`<section class="card"><div class="datebar"><button onclick="weekOffset--;selected=null;render()">‹</button><strong>${days[0].toLocaleDateString('en-AU',{day:'numeric',month:'short'})} – ${days[6].toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</strong><button onclick="weekOffset++;selected=null;render()">›</button></div><div class="week">${days.map(d=>`<button class="${selected===key(d)?'active':''}" onclick="selected='${key(d)}';render()"><small>${'MTWTFSS'[(d.getDay()+6)%7]}</small>${d.getDate()}</button>`).join('')}</div><div class="small" style="margin-top:22px">Selected day</div><div class="big">${fmt(sum(selected))} <span class="small">kcal</span></div><button class="secondary" onclick="goDay('${selected}')">View / edit this day</button></section><div class="grid2"><section class="card"><div class="small">Weekly total</div><div class="big" style="font-size:24px">${fmt(total)}</div><div class="small">kcal</div></section><section class="card"><div class="small">Daily average</div><div class="big" style="font-size:24px">${loggedDays?fmt(total/loggedDays):'—'}</div><div class="small">kcal / day</div></section></div><p class="muted">Average counts only days with food entries (${loggedDays} logged ${loggedDays===1?'day':'days'}).</p>`}else if(tab==='saved'){content=`<p class="muted">Tap + to log a saved food on your selected day.</p><section class="card">${data.favourites.length?data.favourites.map(f=>`<div class="line"><div><div>${esc(f.name)}</div><div class="small">${fmt(f.cal)} kcal</div></div><div style="display:flex;gap:4px"><button class="secondary" style="width:auto" onclick="addSaved('${f.id}')">+</button><button class="plain" style="width:auto;font-size:15px" onclick="removeSaved('${f.id}')">Remove</button></div></div>`).join(''):'<div class="empty">No saved foods yet</div>'}</section>`}else{content=`<section class="card"><label class="field" for="goal">Daily calorie goal</label><input id="goal" type="number" min="1" inputmode="numeric" value="${data.goal}"><button class="primary" onclick="updateGoal()">Save goal</button></section><section class="card"><div class="line"><span>Theme</span><span class="small">Light</span></div><div class="line"><span>Storage</span><span class="small">This iPhone</span></div><div class="line"><span>Week starts</span><span class="small">Monday</span></div></section><p class="muted">Your data is stored locally in this browser app. Clearing website data or deleting the app can erase it. There is no backup or account sync.</p>`} $('app').innerHTML=`<header><div><div class="eyebrow">CALORIE</div><h1>${{today:'Today',history:'History',saved:'Saved Foods',settings:'Settings'}[tab]}</h1></div><div style="color:#347ef0;font-size:25px">◯</div></header>${content}`;$('nav').innerHTML=[['today','⌂','Today'],['history','▦','History'],['saved','▤','Saved'],['settings','⚙','Settings']].map(([id,ico,label])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><span>${ico}</span>${label}</button>`).join('')};function goDay(k){let parts=k.split('-').map(Number),target=new Date(parts[0],parts[1]-1,parts[2],12);offset=Math.round((target-at(0))/86400000);tab='today';render()}function closeSheet(){$('overlay').innerHTML='';editing=null}function openFood(id){editing=id||null;let f=entries(dayKey()).find(x=>x.id===id);unit='kcal';$('overlay').innerHTML=`<div class="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="row"><h2>${f?'Edit food':'Add food'}</h2><button class="plain" onclick="closeSheet()">×</button></div>${!f&&data.favourites.length?'<button class="secondary" style="width:100%;margin-bottom:8px" onclick="showFavouritePicker()">★ Choose a saved food</button>':''}<label class="field">Food name</label><input id="foodname" type="text" maxlength="100" placeholder="e.g. Chicken sandwich" value="${f?esc(f.name):''}"><label class="field">Energy amount</label><input id="energy" type="number" inputmode="decimal" min="0" placeholder="Enter amount" value="${f?f.cal:''}" oninput="conversion()"><div class="unit" style="margin-top:10px"><button id="kcal" class="active" onclick="chooseUnit('kcal')">kcal</button><button id="kj" onclick="chooseUnit('kJ')">kJ</button></div><div class="hint" id="converted"></div><label style="display:flex;align-items:center;gap:10px;margin-top:18px"><input type="checkbox" id="fav"> Save to favourites</label><button class="primary" onclick="submitFood()">${f?'Save changes':'Add food'}</button>${f?'<button class="danger" onclick="confirmDelete()">Delete food</button>':''}</div></div>`}function showFavouritePicker(){let items=data.favourites.map(f=>`<div class="line"><div><div>${esc(f.name)}</div><div class="small">${fmt(f.cal)} kcal</div></div><button class="secondary" style="width:auto" onclick="addSaved('${f.id}');closeSheet()">+ Add</button></div>`).join('');$('overlay').innerHTML=`<div class="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="row"><h2>Saved foods</h2><button class="plain" onclick="closeSheet()">×</button></div><div style="max-height:55vh;overflow-y:auto">${items}</div><button class="secondary" style="width:100%;margin-top:14px" onclick="openFood()">Back to manual entry</button></div></div>`}function chooseUnit(u){unit=u;$('kcal').classList.toggle('active',u==='kcal');$('kj').classList.toggle('active',u==='kJ');conversion()}function conversion(){let n=Number($('energy').value);$('converted').textContent=unit==='kJ'&&$('energy').value?`≈ ${fmt(n/4.184)} kcal`:''}function submitFood(){let name=$('foodname').value.trim(),v=Number($('energy').value);if(!name||!$('energy').value||!Number.isFinite(v)||v<0){alert('Enter a food name and a valid energy amount.');return}let cal=Math.round(unit==='kJ'?v/4.184:v),k=dayKey();if(!data.entries[k])data.entries[k]=[];if(editing){let i=data.entries[k].findIndex(f=>f.id===editing);if(i>=0)data.entries[k][i]={...data.entries[k][i],name,cal}}else data.entries[k].push({id:uid(),name,cal});if($('fav').checked){data.favourites=data.favourites.filter(f=>f.name.toLowerCase()!==name.toLowerCase());data.favourites.unshift({id:uid(),name,cal,used:Date.now()})}save();closeSheet();render()}function confirmDelete(){if(!confirm('Delete this food entry?'))return;data.entries[dayKey()]=entries(dayKey()).filter(f=>f.id!==editing);save();closeSheet();render()}function addSaved(id){let f=data.favourites.find(x=>x.id===id);if(!f)return;let k=dayKey();if(!data.entries[k])data.entries[k]=[];data.entries[k].push({id:uid(),name:f.name,cal:f.cal});f.used=Date.now();data.favourites.sort((a,b)=>(b.used||0)-(a.used||0));save();tab='today';render()}function removeSaved(id){if(!confirm('Remove this saved food?'))return;data.favourites=data.favourites.filter(f=>f.id!==id);save();render()}function updateGoal(){let n=Number($('goal').value);if(!Number.isInteger(n)||n<=0||n>100000){alert('Enter a valid calorie goal.');return}data.goal=n;save();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
